[tool.ruff]
# Our real floor is HA 2026.3.0's (hacs.json), which requires Python >=3.14.2.
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
